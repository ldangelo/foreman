name: claudeedit
description: Acceptance harness workflow. One REAL claude phase (haiku) that carries out the task and commits. Only for scenarios that name it.
task_types: [claude-e2e]
worktree:
  enabled: true
  branch: foreman/{task_id}/{run_id}
  path: workspace
  cleanup: on_success
phases:
  - name: edit
    prompt: edit.md
    provider: claude
    approval_mode: auto_approve
    models:
      default: haiku
    commit: true
