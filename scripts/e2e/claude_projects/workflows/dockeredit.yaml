name: dockeredit
description: Acceptance harness workflow. One phase run through the DOCKER sandbox by a simulated pi baked into the sandbox image. Only for scenarios that name it.
task_types: [docker-e2e]
sandbox: docker
worktree:
  enabled: true
  branch: foreman/{task_id}/{run_id}
  path: workspace
  cleanup: on_success
phases:
  - name: edit
    prompt: edit.md
    provider: pi
    models:
      default: __E2E_MODEL__
    commit: true
