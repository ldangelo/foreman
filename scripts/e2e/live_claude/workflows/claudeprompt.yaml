name: claudeprompt
description: Live acceptance workflow. One claude phase with approval_mode prompt (in-flight tool approvals).
task_types: [docs]
worktree:
  enabled: true
  branch: foreman/{task_id}/{run_id}
  path: workspace
  cleanup: on_success
phases:
  - name: edit
    prompt: edit.md
    provider: claude
    approval_mode: prompt
    models:
      default: haiku
    commit: true
