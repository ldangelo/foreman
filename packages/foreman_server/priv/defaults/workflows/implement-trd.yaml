name: implement-trd
description: Implement a Technical Requirements Document via the ensemble implement-trd skill under Foreman-managed execution.
# Operator timeout in ms (TRD-027). Default when absent: 300000 (5 min) —
# `Agents.OperatorQuestionDispatcher.@operator_timeout_ms_default`.
operator_timeout_ms: 300000
# The run's worktree. WORKFLOW-level, because a run has exactly one worktree for
# its whole execution — every phase runs in this checkout on this branch. Each
# field below is the default stated explicitly; the block is legal on any
# workflow.
#
# `base` pins the checkout to the ImplementationContext's frozen
# `source_revision` (TRD Decisions 3/5). `assert_base_matches/3` fails the run if
# it resolves to anything else. On a workflow with no ImplementationContext this
# key is resolved against the project checkout instead; omitted, the base is that
# checkout's HEAD.
#
# `cleanup: never` is also the default, spelled out because it is the
# load-bearing choice: the worktree is what AutoPR pushes from, so reclaiming it
# earlier leaves a finished run with nothing to propose. Reclamation happens
# once, in `finalize_run/1`, after AutoPR.
worktree:
  enabled: true
  base: "{{implementation.source_revision}}"
  branch: foreman/{task_id}/{run_id}
  path: workspace
  cleanup: never
# `commit:` is PHASE-level, unlike `worktree:` above: a run has one worktree so a
# phase has nothing to decide there, but each phase produces its own output, so
# whether that output becomes a commit is a per-phase question. `true` commits
# the phase's work when the phase completes; absent defaults to `true`.
#
# This workflow has a single phase, so `false` could not be honored here and is
# rejected at load: with no later phase to absorb the deferred work it would
# stay uncommitted, and AutoPR proposes commits only.
phases:
  - name: implement-trd
    timeout_minutes: 60
    command: "/skill:ensemble-full-implement-trd {{implementation.trd_path_argument}} --foreman"
    commit: true
