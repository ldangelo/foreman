name: fix
description: Fix an issue via the ensemble fix workflow.
# Operator timeout in ms (TRD-027). Default when absent: 300000 (5 min) —
# `Agents.OperatorQuestionDispatcher.@operator_timeout_ms_default`.
operator_timeout_ms: 300000
# The run's worktree. WORKFLOW-level, because a run has exactly one worktree for
# its whole execution. Every field is the default stated explicitly. `base` is
# omitted deliberately: this workflow carries no ImplementationContext, so the
# base is the project checkout's HEAD at the moment the run's first phase starts.
worktree:
  enabled: true
  branch: foreman/{run_id}
  path: workspace
  cleanup: never
# `commit:` is PHASE-level, unlike `worktree:` above: a run has one worktree so a
# phase has nothing to decide there, but each phase produces its own output, so
# whether that output becomes a commit is a per-phase question. `true` commits
# the phase's work when the phase completes; absent defaults to `true`.
#
# This workflow has a single phase, so `false` could not be honored here and is
# rejected at load: with no later phase to absorb the deferred work it would
# stay uncommitted, and AutoPR proposes commits only.
phases:
  - name: fix
    command: "/skill:ensemble-fix-issue --foreman"
    commit: true
