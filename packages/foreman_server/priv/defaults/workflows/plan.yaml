name: plan
description: Create draft product and technical requirements for later refinement.
# Operator timeout in ms (TRD-027). Default: 300000 (5 min).
operator_timeout_ms: 300000
phases:
  - name: create-prd
    timeout_minutes: 10
    command: "/skill:ensemble-full-create-prd --foreman"
    requiredFile: planning.prd_path
  - name: create-trd
    timeout_minutes: 10
    command: "/skill:ensemble-full-create-trd-foreman --foreman"
    requiredFile: planning.trd_path
