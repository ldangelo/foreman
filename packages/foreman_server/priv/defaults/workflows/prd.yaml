name: prd
description: Create a PRD through the full ensemble chain: create-prd, refine-prd, create-trd, refine-trd, implement-trd.
# Operator timeout in ms (TRD-027). Default when absent: 300000 (5 min) —
# `Agents.OperatorQuestionDispatcher.@operator_timeout_ms_default`.
operator_timeout_ms: 300000
# The run's worktree. WORKFLOW-level, because a run has exactly one worktree for
# its whole execution: all five phases below run in this one checkout on this one
# branch. A later phase reads an earlier phase's documents as ordinary files
# rather than inheriting them through per-phase branches, and Foreman commits
# each phase's output at the phase boundary, so this branch accumulates the whole
# pipeline and is what AutoPR proposes.
#
# Every field is the default stated explicitly. `base` is omitted deliberately:
# this workflow carries no ImplementationContext, so the base is the project
# checkout's HEAD at the moment phase 1 starts.
worktree:
  enabled: true
  branch: foreman/{task_id}/{run_id}
  path: workspace
  cleanup: never
# `commit:` is PHASE-level — the opposite shape from `worktree:` above, and
# deliberately so. A run has one worktree, so a phase has nothing to decide
# there; but each phase produces its own output, so whether that output becomes
# a commit is a per-phase question. `true` commits the phase's work when the
# phase completes; `false` defers it so a later phase's commit absorbs it,
# which is how several phases are batched into one commit. Absent defaults to
# `true`.
#
# Every phase here commits, so each document lands as its own reviewable commit
# on the run branch. Deferral is refused at load in exactly one case: the
# manifest's LAST phase defers AND the worktree `cleanup:` is `always` or
# `on_success`, because reclaiming the checkout would destroy work no phase ever
# committed. Deferring under `cleanup: never` (as configured above) is
# supported — the work survives in the worktree for a human to inspect, and
# `RunExecutor` warns at run end that it was left uncommitted.
#
# Two earlier refusals are gone and should not be re-derived from older
# comments: `commit: false` before a `requiredFile:` phase is allowed (that gate
# discovers documents by git status against the phase's base, so a predecessor's
# uncommitted work is correctly not seen as the successor's own), and a manifest
# where no phase commits at all is allowed (AutoPR proposes nothing, which is a
# legitimate stage-for-review outcome rather than an error).
phases:
  - name: create-prd
    timeout_minutes: 10
    command: "/skill:ensemble-create-prd --foreman"
    commit: true
  - name: refine-prd
    timeout_minutes: 10
    command: "/skill:ensemble-refine-prd --foreman"
    commit: true
  - name: create-trd
    timeout_minutes: 10
    command: "/skill:ensemble-create-trd --foreman"
    commit: true
  - name: refine-trd
    timeout_minutes: 15
    command: "/skill:ensemble-refine-trd-foreman --foreman"
    commit: true
  - name: implement-trd
    timeout_minutes: 60
    command: "/skill:ensemble-implement-trd --foreman"
    commit: true
