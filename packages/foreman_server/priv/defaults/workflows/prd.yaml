name: prd
description: Create a PRD through the full ensemble chain: create-prd, refine-prd, create-trd, refine-trd, implement-trd.
# Operator timeout in ms (TRD-027). Default when absent: 300000 (5 min) —
# `Agents.OperatorQuestionDispatcher.@operator_timeout_ms_default`.
operator_timeout_ms: 300000
# The run's worktree. WORKFLOW-level, because a run has exactly one worktree for
# its whole execution: all five phases below run in this one checkout on this one
# branch. A later phase reads an earlier phase's documents as ordinary files
# rather than inheriting them through per-phase branches, and Foreman commits
# each phase's output at the phase boundary, so this branch accumulates the whole
# pipeline and is what AutoPR proposes.
#
# Every field is the default stated explicitly. `base` is omitted deliberately:
# this workflow carries no ImplementationContext, so the base is the project
# checkout's HEAD at the moment phase 1 starts.
worktree:
  enabled: true
  branch: foreman/{run_id}
  path: workspace
  cleanup: never
phases:
  - name: create-prd
    command: "/skill:ensemble-full-create-prd --foreman"
  - name: refine-prd
    command: "/skill:ensemble-full-refine-prd --foreman"
  - name: create-trd
    command: "/skill:ensemble-full-create-trd --foreman"
  - name: refine-trd
    command: "/skill:ensemble-full-refine-trd-foreman --foreman"
  - name: implement-trd
    command: "/skill:ensemble-full-implement-trd --foreman"
