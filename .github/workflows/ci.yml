name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Spike — no build yet)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config --global user.email "ci@foreman.dev"
          git config --global user.name "Foreman CI"
          git config --global init.defaultBranch main

      - name: Validate compose.yaml
        run: docker compose -f compose.yaml config --quiet

      - name: Check shell script syntax
        run: bash -n scripts/dev-compose-up.sh

      - name: Validate YAML files
        run: |
          pip install pyyaml -q
          shopt -s nullglob globstar
          for f in .github/workflows/*.yml .github/workflows/*.yaml src/defaults/workflows/**/*.yaml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null || {
              echo "Invalid YAML: $f"
              exit 1
            }
            echo "valid: $f"
          done
          echo "All YAML files valid"

      - name: Validate constitution and spec markdown
        run: |
          for f in docs/standards/constitution.md docs/architecture/spike-slice-spec.md AGENTS.md; do
            if [ -f "$f" ]; then
              lines=$(wc -l < "$f")
              if [ "$lines" -lt 10 ]; then
                echo "Suspiciously short: $f ($lines lines)"
                exit 1
              fi
              echo "$f: $lines lines — OK"
            fi
          done

      - name: Check required files exist
        run: |
          required="devbox.json compose.yaml AGENTS.md docs/standards/constitution.md docs/architecture/spike-slice-spec.md"
          for f in $required; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
            echo "$f — present"
          done
