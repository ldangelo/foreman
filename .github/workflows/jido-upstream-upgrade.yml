name: jido-upstream-upgrade
on:
  workflow_dispatch:
  repository_dispatch:
    types: [jido_release]
jobs:
  test-upstream-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foreman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foreman_test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          otp-version: 27.x
      - name: Install hex/rebar
        run: mix local.hex --force && mix local.rebar --force
      - name: Verify Jido fork pins
        run: echo "JRM-T003 reading pins from JIDO_FORKS.md"
      - name: JRM-T004 evaluate upstream release
        run: bash scripts/ci/jido-upgrade-evaluation.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jido-upstream-upgrade-results
          path: packages/foreman_server/_build/test/test-results/